name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  quality:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: uv installieren
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Abhängigkeiten installieren
        run: uv sync --locked

      - name: Codequalität mit Ruff prüfen
        run: uv run ruff check .

      - name: Tests mit Coverage ausführen
        run: uv run pytest --cov=src/blog --cov-report=term-missing --cov-report=xml --cov-report=html

      - name: Coverage-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error

      - name: HTML-Coverage-Report hochladen
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/
          if-no-files-found: error

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: Container-Image bauen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: flask-blog:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container-Funktionstest ausführen
        run: |
          mkdir -p ci-artifacts

          docker run -d --name flask-blog-ci \
            -e DATABASE=/tmp/ci-blog.db \
            -p 127.0.0.1:5000:5000 \
            flask-blog:ci-${{ github.sha }} \
            sleep infinity

          docker exec flask-blog-ci sh -c \
            'uv run yoyo apply --database sqlite:////tmp/ci-blog.db migrations/ > /tmp/migration.log 2>&1'

          {
            echo "# Datenbank-Migrationsbericht"
            echo ""
            echo "## Migrationsprotokoll"
            echo ""
            echo '```text'
            docker exec flask-blog-ci cat /tmp/migration.log
            echo '```'
          } | tee ci-artifacts/migration-report.md >> "$GITHUB_STEP_SUMMARY"

          docker exec -d flask-blog-ci \
            uv run flask --app blog.app:create_app run --host=0.0.0.0 --port=5000

          sleep 3

          curl --fail --silent --show-error \
            http://127.0.0.1:5000/ | grep -q "Blog"

          {
            echo ""
            echo "## Funktionstest"
            echo ""
            echo "| Prüfung | Ergebnis |"
            echo "|---|---|"
            echo "| Migration im Container | erfolgreich |"
            echo "| Webserver gestartet | erfolgreich |"
            echo "| HTTP GET / | erfolgreich |"
          } | tee -a ci-artifacts/migration-report.md >> "$GITHUB_STEP_SUMMARY"

          docker logs flask-blog-ci

      - name: Migrationsbericht hochladen
        uses: actions/upload-artifact@v4
        with:
          name: migration-report
          path: ci-artifacts/migration-report.md
          if-no-files-found: error

      - name: Testcontainer entfernen
        if: always()
        run: docker rm -f flask-blog-ci
