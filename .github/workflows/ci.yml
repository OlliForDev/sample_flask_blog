name: CI

on:
  pull_request:
    branches:
      - staging
      - main

  push:
    branches:
      - staging
      - main

jobs:
  quality:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: uv installieren
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Abhängigkeiten installieren
        run: uv sync --locked

      - name: Codequalität mit Ruff prüfen
        run: uv run ruff check .

      - name: Tests mit Coverage ausführen
        run: uv run pytest --cov=src/blog --cov-report=term-missing --cov-report=xml --cov-report=html

      - name: Coverage-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error

      - name: HTML-Coverage-Report hochladen
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/
          if-no-files-found: error

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: Container-Image bauen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: flask-blog:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container-Funktionstest ausführen
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts

          diagnostics() {
            docker logs flask-blog-ci > ci-artifacts/container.log 2>&1 || true
            cat ci-artifacts/container.log
            docker inspect flask-blog-ci \
              --format '{{json .State}}' || true
          }
          trap diagnostics EXIT

          docker run -d --name flask-blog-ci \
            -e APP_MODULE="blog.app:create_app()" \
            -e SQLITE_PATH=/tmp/ci-blog.db \
            -e GUNICORN_WORKERS=1 \
            -e GUNICORN_TIMEOUT=60 \
            -e PORT=5000 \
            -e FLASK_DEBUG=0 \
            -p 127.0.0.1:5000:5000 \
            flask-blog:ci-${{ github.sha }}

          ready=false

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              --max-time 2 \
              http://127.0.0.1:5000/ \
              -o ci-artifacts/homepage.html; then
              ready=true
              break
            fi

            if [ "$(docker inspect --format '{{.State.Running}}' flask-blog-ci)" != "true" ]; then
              echo "Container wurde vorzeitig beendet."
              exit 1
            fi

            sleep 2
          done

          if [ "$ready" != "true" ]; then
            echo "Anwendung wurde nicht rechtzeitig erreichbar."
            exit 1
          fi

          grep -q "Blog" ci-artifacts/homepage.html

          {
            echo "# Container-Funktionstest"
            echo ""
            echo "| Prüfung | Ergebnis |"
            echo "|---|---|"
            echo "| Containerstart über Entrypoint | erfolgreich |"
            echo "| HTTP GET / | erfolgreich |"
            echo "| Startseite enthält Blog | erfolgreich |"
          } | tee ci-artifacts/migration-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Container-Testberichte hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-test-report
          path: ci-artifacts/
          if-no-files-found: warn

      - name: Testcontainer entfernen
        if: always()
        run: docker rm -f flask-blog-ci

  deploy-production:
    name: Production freigeben und Deploy auslösen
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions: {}

    environment:
      name: production

    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - name: Geprüften Commit auf Render deployen
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          DEPLOY_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Das Environment-Secret RENDER_DEPLOY_HOOK_URL fehlt."
            exit 1
          fi

          echo "Deployment für Commit $DEPLOY_COMMIT wird angefordert."

          curl --fail --silent --show-error \
            --connect-timeout 10 \
            --max-time 60 \
            --get \
            --data-urlencode "ref=$DEPLOY_COMMIT" \
            "$RENDER_DEPLOY_HOOK_URL" \
            --output /dev/null

          {
            echo "## Production-Deployment angefordert"
            echo ""
            echo "Commit: $DEPLOY_COMMIT"
            echo ""
            echo "Render hat die Anfrage akzeptiert."
            echo "Build- und Deployment-Erfolg im Render-Dashboard prüfen."
          } >> "$GITHUB_STEP_SUMMARY"
