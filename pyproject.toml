[project]
name = "sample-flask-blog"
version = "0.1.0"
description = "Mini-Blog für die CI/CD-Fallstudie"
requires-python = ">=3.11"
dependencies = ["flask>=3.1", "gunicorn>=26.2.0", "yoyo-migrations>=9.0"]
[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.8"]

[project.scripts]
blog = "blog.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --tb=short --cov=src/blog --cov-report=term-missing"
#Die Warnungen stammen aus Yoyo bzw. der SQLite-Adapter-Deprecation unter Python 3.12+
filterwarnings = [
    "ignore:The default datetime adapter is deprecated:DeprecationWarning",
    "ignore:unclosed database in <sqlite3.Connection object at:ResourceWarning",
]

[tool.coverage.run]
source = ["src/blog"]
branch = true

[tool.coverage.report]
fail_under = 70
show_missing = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
